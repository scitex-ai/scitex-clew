[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scitex-clew"
version = "0.20.1"
description = "Verifiable knowledge graph for scientific experiments"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [
    { name = "Yusuke Watanabe", email = "ywatanabe@scitex.ai" },
]
keywords = [
    "reproducibility",
    "verification",
    "hash",
    "dag",
    "provenance",
    "scitex",
    "science",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # Every store resolves through `scitex_dev.store.host_store()`, so the
    # floor must be a scitex-dev that actually HAS a working store. 0.17.8
    # does not, and the old floor let a stale consumer install cleanly and
    # then fail at use — scitex-python pinned `scitex-dev==0.28.0`, resolved
    # happily, and got `ModuleNotFoundError: No module named
    # 'scitex_dev.store'` at import.
    #
    # 0.49.2 is measured, not guessed, and importing is NOT the test: 0.43.1
    # is the first release with the module and `host_store`, yet a real
    # write-then-read raises `TypeError: tuple indices must be integers or
    # slices, not str` inside `Store.rows()`. Running a real record+read
    # against PostgreSQL with the published clew wheel: 0.43.1 FAIL, 0.46.0
    # FAIL, 0.48.0 FAIL, 0.49.0 FAIL, 0.49.2 OK, 0.49.3 OK, 0.50.0 OK,
    # 0.57.0 OK.
    "scitex-dev>=0.49.2",
    "click>=8.1",
]
[project.optional-dependencies]
all = [
    "click>=8.0.0",
    "fastmcp>=2.0.0",
    "matplotlib",
    "cryptography>=41.0",
]
dev = [
    "fastmcp",
    "click>=8.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    # pytest-timeout — CI runs pytest with --timeout=120 (test.yml).
    "pytest-timeout>=2.0",
    # Same floor as the runtime dependency above — a dev install that cannot
    # open a store cannot run the suite either.
    "scitex-dev>=0.49.2",
    "cryptography>=41.0",
    # clew's stores are Postgres-backed and its tests run against a REAL
    # database (tests/conftest.py gives each test its own schema). Declared
    # here rather than relied on transitively: conftest skips when the
    # driver is missing, and a silently-absent psycopg would turn the whole
    # store suite into skips that read exactly like passes.
    "psycopg[binary]>=3.1",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]

[project.scripts]
clew = "scitex_clew._cli._main:main"
scitex-clew = "scitex_clew._cli._main:main"
[project.entry-points."scitex_dev.docs"]
scitex-clew = "scitex_clew"
[project.entry-points."scitex_dev.skills"]
scitex-clew = "scitex_clew"

[project.entry-points."scitex_dev.linter.plugins"]
clew = "scitex_clew._linter_plugin:get_plugin"

[project.entry-points."scitex_dev.gate.checks"]
scitex-clew = "scitex_clew._gate_plugin:provide"

# Observer federation: scitex-io / scitex-session scan these entry-point groups
# on THEIR import and invoke each 0-arg registrar, so clew's auto-provenance
# hooks self-activate from `import scitex_io` / `import scitex_session` ALONE —
# no `import scitex_clew` needed in the mission script (the clean-idiom path).
# Acyclic: the peer discovers the callable via importlib.metadata, never imports
# clew in source. register_with_* are idempotent (safe alongside the legacy
# import-time bootstrap during rollout).
[project.entry-points."scitex_io.observers"]
scitex-clew = "scitex_clew._observers:register_with_scitex_io"

[project.entry-points."scitex_session.observers"]
scitex-clew = "scitex_clew._observers:register_with_scitex_session"
[project.urls]
Homepage = "https://github.com/ywatanabe1989/scitex-clew"
Repository = "https://github.com/ywatanabe1989/scitex-clew"
Documentation = "https://scitex-clew.readthedocs.io"
[tool.hatch.build.targets.wheel]
packages = ["src/scitex_clew"]
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# Subprocess coverage wiring (skill leaf 05_development_06_subprocess-coverage):
# parallel=true makes every coverage process write to its own
# .coverage.<host>.<pid>.<rand> shard; concurrency covers subprocess.run + threads.
parallel = true
source = ["scitex_clew"]
concurrency = ["multiprocessing", "thread"]

[tool.scitex-linter]
library_dirs = ["src", "tests", "examples"]

[tool.scitex_dev.audit]
# PS-168 — Per-package secret + env-var prefix in GitHub Actions workflows.
# `GH_PERSONAL_ACCESS_TOKEN` is the ecosystem-wide cross-cutting PAT used
# by the contributor-assistant CLA action. The natural GITHUB_* namespace
# is reserved by GitHub Actions on the secret-name surface (HTTP 422 on
# every `gh secret set`), so the GH_ shorthand is the canonical
# substitute and is registered ecosystem-wide via PR #122 on scitex-dev
# (EXCEPTION_SECRETS_DEFAULT). This per-package entry pins the same
# exception inline so the audit passes on every scitex-dev version,
# independent of release timing.
ps168_secret_exceptions = ["GH_PERSONAL_ACCESS_TOKEN"]
