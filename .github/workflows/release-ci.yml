name: release-ci

# Post-merge/scheduled full Python matrix on the Docker service runner.
# Required-status job names, CLA and native audit assertions are preserved.

on:
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 7 * * *"  # nightly 07:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pytest-matrix:
    # Disposable PostgreSQL on the Docker runner; no managed store fallback.
    name: pytest-matrix-on-ubuntu-py${{ matrix.python-version }}
    runs-on: [self-hosted, Linux, X64, scitex-docker]
    services:
      postgres:
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scitex
        ports:
          - '127.0.0.1::5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Set up Python ${{ matrix.python-version }} (uv-managed)
        run: .github/ci/native-job.sh uv python install ${{ matrix.python-version }}
      - name: Create uv venv on this matrix Python
        run: .github/ci/native-job.sh uv venv --python ${{ matrix.python-version }} .venv
      - name: Install dependencies
        run: |
          .github/ci/native-job.sh uv pip install --python .venv/bin/python -e ".[all,dev]"
      - name: Confirm the driver is installed
        run: .github/ci/native-job.sh .venv/bin/python -c "import psycopg; print('psycopg', psycopg.__version__)"
      - name: Run tests against the service database
        env:
          RUN_E2E: '1'
          SCITEX_CLEW_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/scitex
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          .github/ci/native-job.sh --service-tests .venv/bin/pytest tests/

  import-smoke:
    # New required-status-check context: "import-smoke / import-smoke-on-ubuntu-py3-12"
    uses: scitex-ai/.github/.github/workflows/import-smoke.yml@main
    secrets: inherit

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Set up Python 3.12 (uv-managed)
        run: .github/ci/native-job.sh uv python install 3.12
      - name: Install package + audit tooling
        run: |
          .github/ci/native-job.sh uv venv --python 3.12 .venv
          .github/ci/native-job.sh uv pip install --python .venv/bin/python -e ".[dev]"
          .github/ci/native-job.sh uv pip install --python .venv/bin/python "scitex-dev[cli-audit]"
      - name: Run scitex-dev ecosystem audit-all
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          .github/ci/native-job.sh .venv/bin/scitex-dev ecosystem audit-all scitex-clew --no-version-check
