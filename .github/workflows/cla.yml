name: CLA Assistant

# PILOT: org-level reusable-workflow caller (scitex-ai/.github, 2026-07-10).
# Triggers/permissions preserved verbatim from the prior local file.
# Reusable workflow defaults (owner_login=ywatanabe1989,
# owner_allowlist="bot*,ywatanabe1989", default_branch=main) already match
# this repo's prior hardcoded values, so no `with:` overrides are needed.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
  push:
    branches: [main, develop]
    tags: ['v*']

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  call:
    uses: scitex-ai/.github/.github/workflows/cla.yml@main
    # NAMED SECRET, not `inherit`. This caller runs on `issue_comment` and
    # `pull_request_target` -- both unauthenticated on a public repo -- and
    # `secrets: inherit` forwards EVERY secret this repo holds into a job an
    # outsider can start, on the shared self-hosted runner the callee targets.
    # Neither file shows that on its own: the caller names no runs-on, so the
    # destination lives in the callee. Pass only the secret the callee declares.
    #
    # This fix ORIGINATED IN PR #140 (fix/cla-named-secret-not-inherit) and is
    # carried here verbatim. #140 targets `main`, which the fleet rule forbids
    # (PR into develop; main is tagged from develop after the merge), so it was
    # stalled and blocked while the hole stayed open. #140 should be closed as
    # superseded, not left to rot -- the diff is its work, not this PR's.
    secrets:
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
